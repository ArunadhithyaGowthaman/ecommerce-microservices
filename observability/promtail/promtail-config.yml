server:
  http_listen_port: 9080

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: timestamp
            service: service
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: RFC3339
    relabel_configs:
      # container name (e.g. inventory-service-1) — useful for debugging a specific replica
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      # service label from docker-compose's own service name — stable across replicas
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'