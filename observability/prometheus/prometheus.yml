global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'node-services'
    metrics_path: '/metrics'
    static_configs:
      - targets:
          - order-service:3001
          - payment-service:3002
          - inventory-service:3003
          - notification-service:3004