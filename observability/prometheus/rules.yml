groups:
  - name: aiops-rca-symptoms
    rules:
      - alert: HighErrorRatio
        expr: |
          (sum by (service) (rate(http_errors_total[30s]))
           / sum by (service) (rate(http_requests_total[30s]))) > 0.05
          and sum by (service) (rate(http_requests_total[30s])) > 0.1
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "Error ratio above 5% on {{ $labels.service }}"

      - alert: HighLatencyP99
        expr: |
          histogram_quantile(0.99,
            sum by (service, le) (rate(http_request_duration_seconds_bucket[30s]))) > 2
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "P99 latency above 2s on {{ $labels.service }}"

      - alert: ServiceDown
        expr: up == 0
        for: 10s
        labels: {severity: critical}
        annotations:
          summary: "{{ $labels.service }} is unreachable"
