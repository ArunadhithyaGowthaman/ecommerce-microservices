global:
  resolve_timeout: 1m

route:
  receiver: default-logger
  group_by: ['cluster']
  group_wait: 15s
  group_interval: 30s
  repeat_interval: 5m
  routes:
    - matchers: ['severity="critical"']
      receiver: rca-pipeline

receivers:
  - name: default-logger
  - name: rca-pipeline
    webhook_configs:
      - url: 'http://host.docker.internal:8000/webhook'
        send_resolved: false