global:
  resolve_timeout: 5m

route:
  receiver: 'default-logger'
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 3h
  routes:
    - match:
        severity: critical
      receiver: 'rca-pipeline'
      group_wait: 10s
      repeat_interval: 1h

receivers:
  - name: 'default-logger'
    # placeholder — no-op, catches non-critical alerts (e.g. HighLatency warnings)

  - name: 'rca-pipeline'
    webhook_configs:
      - url: 'http://REPLACE_ME_MODULE_4:8000/webhook'
        send_resolved: false
    # TODO(Module 4): replace url once your FastAPI receiver is live