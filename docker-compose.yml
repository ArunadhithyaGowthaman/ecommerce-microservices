services:
  # ==================== DATABASES ====================
  mongodb-order:
    image: mongo:7
    container_name: mongodb-order
    ports:
      - "27017:27017"
    volumes:
      - mongodb_order_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-payment:
    image: mongo:7
    container_name: mongodb-payment
    ports:
      - "27018:27017"
    volumes:
      - mongodb_payment_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-inventory:
    image: mongo:7
    container_name: mongodb-inventory
    ports:
      - "27019:27017"
    volumes:
      - mongodb_inventory_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb-notification:
    image: mongo:7
    container_name: mongodb-notification
    ports:
      - "27020:27017"
    volumes:
      - mongodb_notification_data:/data/db
    networks:
      - ecommerce-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MESSAGE BROKER ====================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    networks:
      - ecommerce-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  # ==================== MICROSERVICES ====================
  inventory-service:
    build: ./services/inventory-service
    container_name: inventory-service
    ports:
      - "3003:3003"
    environment:
      PORT: 3003
      MONGODB_URI: mongodb://mongodb-inventory:27017/inventory_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      NODE_ENV: production
      SERVICE_NAME: inventory-service
    depends_on:
      mongodb-inventory:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  payment-service:
    build: ./services/payment-service
    container_name: payment-service
    ports:
      - "3002:3002"
    environment:
      PORT: 3002
      MONGODB_URI: mongodb://mongodb-payment:27017/payment_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      NODE_ENV: production
      SERVICE_NAME: payment-service
    depends_on:
      mongodb-payment:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  order-service:
    build: ./services/order-service
    container_name: order-service
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      MONGODB_URI: mongodb://mongodb-order:27017/order_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      PAYMENT_SERVICE_URL: http://payment-service:3002
      NODE_ENV: production
      SERVICE_NAME: order-service
    depends_on:
      mongodb-order:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      inventory-service:
        condition: service_started
      payment-service:
        condition: service_started
    networks:
      - ecommerce-network
    restart: on-failure

  notification-service:
    build: ./services/notification-service
    container_name: notification-service
    ports:
      - "3004:3004"
    environment:
      PORT: 3004
      MONGODB_URI: mongodb://mongodb-notification:27017/notification_db
      RABBITMQ_URL: amqp://rabbitmq:5672
      NODE_ENV: production
      SERVICE_NAME: notification-service
    depends_on:
      mongodb-notification:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - ecommerce-network
    restart: on-failure

  # ==================== API GATEWAY ====================
  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "3010:3000"
    environment:
      PORT: 3000
      JWT_SECRET: ecommerce-jwt-secret-key-for-college-demo
      JWT_EXPIRES_IN: 24h
      ORDER_SERVICE_URL: http://order-service:3001
      PAYMENT_SERVICE_URL: http://payment-service:3002
      INVENTORY_SERVICE_URL: http://inventory-service:3003
      NOTIFICATION_SERVICE_URL: http://notification-service:3004
      NODE_ENV: production
    depends_on:
      - order-service
      - payment-service
      - inventory-service
      - notification-service
    networks:
      - ecommerce-network
    restart: on-failure

  # ==================== FRONTEND ====================
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:3010
    container_name: frontend
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - ecommerce-network
    restart: on-failure

  # ==================== OBSERVABILITY ====================
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./observability/prometheus/rules.yml:/etc/prometheus/rules.yml
    ports:
      - "9090:9090"
    networks:
      - ecommerce-network

  loki:
    image: grafana/loki:2.9.4
    container_name: loki
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki/loki-config.yml:/etc/loki/local-config.yaml
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - ecommerce-network

  promtail:
    image: grafana/promtail:2.9.4
    container_name: promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./observability/promtail/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    networks:
      - ecommerce-network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3300:3000"   # host port changed to 3300 — 3000 is used by api-gateway's container-internal port / other local apps
    volumes:
      - ./observability/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
    networks:
      - ecommerce-network
    depends_on:
      - prometheus
      - loki

  alertmanager:
    image: prom/alertmanager:latest
    container_name: alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./observability/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge

volumes:
  mongodb_order_data:
  mongodb_payment_data:
  mongodb_inventory_data:
  mongodb_notification_data:
  rabbitmq_data: